# Local rehearsal: the lab's scripts against Docker only (no AWS, no ClickHouse Cloud).
#   pg: PostgreSQL 18 + pg_clickhouse 0.11.0 (the image the EC2 front end uses; image read 2026-10-09)
#   ch: ClickHouse server 26.9.13.15 (stable tag list read 2026-10-09 on Docker Hub)
# Both pinned by digest. rehearse.sh sets PARQUET_DIR, CSV_DIR, REHEARSAL_PASSWORD (random per run) and the host ports.
name: aa-rehearsal
services:
  ch:
    image: clickhouse/clickhouse-server:26.9.13.15@sha256:04fc72b8a58e58200c706f375ef81ec7112de3515e898de63f6c72843d7a2eeb
    container_name: aa-rehearsal-ch
    environment:
      CLICKHOUSE_PASSWORD: ${REHEARSAL_PASSWORD:?set by rehearse.sh}
      CLICKHOUSE_DO_NOT_CHOWN: "1"   # the Parquet mount is read-only
    ports:
      - "127.0.0.1:${CH_NATIVE_PORT:-19000}:9000"
    volumes:
      - ${PARQUET_DIR:?set by rehearse.sh}:/var/lib/clickhouse/user_files/tpcds:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
  pg:
    image: ghcr.io/clickhouse/pg_clickhouse:18-0.11.0@sha256:ce7a2b4bc7ee899fc1b87c82c87435acc8ede0903b138c66a580ccd197f88b29
    container_name: aa-rehearsal-pg
    environment:
      POSTGRES_PASSWORD: ${REHEARSAL_PASSWORD:?set by rehearse.sh}
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - ${CSV_DIR:?set by rehearse.sh}:/csv:ro
    depends_on:
      ch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 5s
      retries: 40
